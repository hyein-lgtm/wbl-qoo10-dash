<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큐텐 운영 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#e6e9f0;--text:#1d2433;--sub:#6b7385;--blue:#2563eb;--blue-soft:#eef3ff;
--red:#dc2626;--orange:#ea580c;--green:#16a34a;--r:12px}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
aside{width:230px;background:#fff;border-right:1px solid var(--line);flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:22px 18px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line)}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.grp{font-size:11px;color:var(--sub);padding:18px 18px 6px}
nav a{display:flex;align-items:center;gap:10px;margin:2px 10px;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
nav a:hover{background:#f3f5f9}nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:500}
nav a .ct{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
main{flex:1;min-width:0;padding:26px 28px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0 0 4px}.desc{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--r);padding:10px 14px;margin:16px 0 0;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.pill{border-radius:20px}.chip.pill.on{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.lbl{color:var(--sub);font-size:13px;margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .t{font-size:12px;color:var(--sub)}.kpi .v{font-size:22px;font-weight:700;margin:6px 0 2px}.kpi .s{font-size:11px;color:var(--sub)}
.red{color:var(--red)}.orange{color:var(--orange)}.green{color:var(--green)}.blue{color:var(--blue)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-top:16px}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0}
.tbl{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.tbl .meta{padding:12px 16px;color:var(--sub);font-size:12px;border-bottom:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:#f8f9fc;font-weight:500;font-size:12px;color:var(--sub);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer}
td{padding:11px 12px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
td.r,th.r{text-align:right}td.t{max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#fafbfe}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;background:#f1f3f7}
.tag.red{background:#fee2e2;color:var(--red)}.tag.orange{background:#ffedd5;color:var(--orange)}.tag.green{background:#dcfce7;color:var(--green)}.tag.blue{background:var(--blue-soft)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.ptitle{font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between}
.ptitle a{font-size:12px;color:var(--blue);cursor:pointer;font-weight:400}
.chart svg{width:100%;height:220px;display:block}
.empty{padding:40px;text-align:center;color:var(--sub)}
.menu-btn{display:none}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 16px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}.f label b{color:var(--red)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--text)}
.f textarea{min-height:80px;resize:vertical}.f.wide{grid-column:1/-1}
.f .hint{font-size:11px;color:var(--sub);margin-top:4px}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px}.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:20px;height:20px;background:#111;color:#fff;cursor:pointer;font-size:11px}
.preview{border:1px solid var(--line);border-radius:8px;padding:16px;max-height:480px;overflow:auto;background:#fff}.preview img{max-width:100%}
.optrow{display:grid;grid-template-columns:1fr 1fr 110px 32px;gap:6px;margin-bottom:6px}
.result{border-radius:var(--r);padding:14px 16px;margin-top:12px}.result.ok{background:#dcfce7;color:#14532d}.result.ng{background:#fee2e2;color:#7f1d1d}
.sumtbl td{padding:6px 10px;border-bottom:1px solid #f0f2f6;white-space:normal}.sumtbl td:first-child{color:var(--sub);width:140px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:720px){aside{position:fixed;left:-240px;z-index:10;transition:.2s;box-shadow:0 0 30px #0002}aside.open{left:0}
main{padding:18px 16px 60px}.menu-btn{display:inline-block}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="logo"><i>Q</i>큐텐 운영 에이전트</div>
  <div class="grp">메인</div>
  <nav>
    <a data-p="home">▦ 통합 대시보드</a>
    <a data-p="products">▥ 상품별 분석</a>
    <a data-p="delay">⏱ 배송지연 관리 <span class="ct" id="delayCt" hidden></span></a>
    <a data-p="orders">☰ 주문 조회</a>
  </nav>
  <div class="grp">상품</div>
  <nav>
    <a data-p="quick">＋ 신규 등록 (간편)</a>
    <a data-p="register">✎ 상품 등록 (직접 입력)</a>
    <a data-p="sheet">📊 정리표 일괄 등록</a>
    <a data-p="batch">📁 폴더 일괄 등록</a>
    <a data-p="patch">✎ 상품 수정</a>
    <a data-p="reglog">✓ 등록 이력</a>
    <a data-p="audit">🔍 등록 상품 검수</a>
  </nav>
  <div class="grp">관리</div>
  <nav><a data-p="rules">⚙ 등록 규칙</a><a data-p="sync">⟳ 동기화 히스토리</a></nav>
</aside>
<main id="main"></main>
</div>
<script>
const $=s=>document.querySelector(s), won=n=>'¥'+Math.round(n||0).toLocaleString(), nf=n=>Math.round(n||0).toLocaleString();
const st={page:location.hash.slice(1)||'home',days:30,q:'',flag:'',status:'',sort:null};
const api=async p=>{const r=await fetch(p,{method:p.includes('sync')&&!p.includes('log')?'POST':'GET'});if(!r.ok)throw new Error(r.status);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PERIODS=[[1,'오늘'],[7,'최근 7일'],[30,'최근 30일'],[90,'최근 3개월'],[0,'전체']];
let SUM=null;

document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{swapState(st.page,a.dataset.p);st.page=a.dataset.p;st.q='';st.flag='';st.status='';location.hash=st.page;$('#side').classList.remove('open');render()});

function head(t,d){return `<div class="head"><div><button class="btn menu-btn" onclick="side.classList.toggle('open')">☰</button>
<h1>${t}</h1><div class="desc">${d}</div></div><div class="chips"><span class="desc" id="lastSync"></span>
<button class="btn" onclick="doSync(this)">⟳ 지금 동기화</button></div></div>
${SUM?.demo?'<div class="banner">데모 데이터로 표시 중이에요. 서버에 QOO10_KEY를 설정하면 실제 큐텐 데이터로 바뀌어요.</div>':''}
${SUM?.last_sync&&!SUM.last_sync.ok?`<div class="banner">최근 동기화 실패: ${esc(SUM.last_sync.message).slice(0,300)}</div>`:''}`}
function periods(){return `<div class="panel chips"><span class="lbl">기간</span>${PERIODS.map(([d,l])=>`<button class="chip ${st.days===d?'on':''}" onclick="st.days=${d};render()">${l}</button>`).join('')}</div>`}
function kpi(t,v,s,c=''){return `<div class="kpi"><div class="t">${t}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`}
function search(ph){return `<div class="search">⌕<input id="q" placeholder="${ph}" value="${esc(st.q)}"></div>`}
function bindSearch(){const i=$('#q');if(!i)return;i.oninput=()=>{clearTimeout(i._t);i._t=setTimeout(()=>{st.q=i.value;render(true)},250)}}
function pills(list,key){return `<div class="chips" style="margin-top:12px"><span class="lbl">빠른 필터</span>${list.map(([v,l])=>`<button class="chip pill ${st[key]===v?'on':''}" onclick="st.${key}=st.${key}==='${v}'?'':'${v}';render(true)">${l}</button>`).join('')}</div>`}
function stTag(s){const c={배송요청:'orange',배송준비:'orange',배송중:'blue',배송완료:'green',구매확정:'green'}[s]||'';return `<span class="tag ${c}">${esc(s)}</span>`}

function table(rows,cols,meta){
  if(st.sort){const [k,dir]=st.sort;rows=[...rows].sort((a,b)=>((a[k]??-1e18)>(b[k]??-1e18)?1:-1)*dir)}
  if(!rows.length)return `<div class="tbl"><div class="meta">${meta}</div><div class="empty">조건에 맞는 데이터가 없어요</div></div>`;
  return `<div class="tbl"><div class="meta">${meta}</div><table><thead><tr>${cols.map(c=>`<th class="${c.r?'r':''}" onclick="sortBy('${c.k}')">${c.h}${st.sort?.[0]===c.k?(st.sort[1]>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
  <tbody>${rows.slice(0,500).map(r=>`<tr>${cols.map(c=>`<td class="${c.r?'r':''} ${c.t?'t':''}" title="${c.t?esc(r[c.k]):''}">${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
window.sortBy=k=>{st.sort=st.sort?.[0]===k?[k,-st.sort[1]]:[k,-1];render(true)};

function bars(data){
  if(!data.length)return '<div class="empty">매출 데이터가 없어요</div>';
  const W=700,H=220,p=28,max=Math.max(...data.map(d=>d.rev),1),bw=(W-p*2)/data.length;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${[0,.5,1].map(t=>`<line x1="${p}" x2="${W-4}" y1="${H-p-(H-p*2)*t}" y2="${H-p-(H-p*2)*t}" stroke="#eef0f4"/><text x="0" y="${H-p-(H-p*2)*t+4}" font-size="10" fill="#8a91a0">${Math.round(max*t/1000)}k</text>`).join('')}
  ${data.map((d,i)=>{const h=(H-p*2)*d.rev/max;return `<rect x="${p+i*bw+bw*.15}" y="${H-p-h}" width="${bw*.7}" height="${h}" rx="2" fill="#2563eb"><title>${d.d} · ${won(d.rev)} · ${d.n}건</title></rect>`}).join('')}
  ${data.filter((_,i)=>i%Math.ceil(data.length/7)===0).map(d=>{const i=data.indexOf(d);return `<text x="${p+i*bw}" y="${H-8}" font-size="10" fill="#8a91a0">${d.d.slice(5)}</text>`}).join('')}</svg>`}

const pages={
 async home(){
  const [s,daily,prods,dl]=await Promise.all([api(`/api/summary?days=${st.days}`),api(`/api/daily?days=${st.days}`),api(`/api/products?days=${st.days}`),api(`/api/orders?days=0&delayed=true`)]);
  const g=s.revenue_prev?((s.revenue/s.revenue_prev-1)*100):null;
  return head('통합 대시보드','큐텐재팬 wbL公式 매출·주문·배송 현황을 한눈에 봐요')+periods()+
  `<div class="kpis">${kpi('매출',won(s.revenue),g==null?'결제금액 합계':`직전 동기간 대비 <b class="${g>=0?'green':'red'}">${g>=0?'+':''}${g.toFixed(1)}%</b>`,'blue')}
  ${kpi('주문 수',nf(s.orders)+'건','결제 완료 기준')}${kpi('객단가',won(s.aov),'매출 ÷ 주문 수')}${kpi('구매 고객',nf(s.buyers)+'명','기간 내 고유 구매자')}
  ${kpi('미발송 주문',nf(s.open_orders)+'건','배송요청 + 배송준비','orange')}${kpi('배송지연',nf(s.delayed)+'건',`결제 후 ${s.delay_days}일 초과 미발송`,s.delayed?'red':'green')}
  ${kpi('판매중 상품',nf(s.products)+'개','ItemStatus S2')}${kpi('재고 부족',nf(s.low_stock)+'개','재고 10개 미만',s.low_stock?'orange':'')}</div>
  <div class="grid2"><div class="panel chart"><div class="ptitle">일별 매출</div>${bars(daily)}</div>
  <div class="panel"><div class="ptitle">매출 TOP 상품 <a onclick="go('products')">전체 보기 →</a></div>
  ${prods.filter(p=>p.rev).slice(0,6).map((p,i)=>`<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f0f2f6"><b class="blue">${i+1}</b><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.title)}</span><b>${won(p.rev)}</b></div>`).join('')||'<div class="empty">판매 없음</div>'}</div></div>
  <div class="panel"><div class="ptitle">배송지연 주문 <a onclick="go('delay')">전체 보기 →</a></div>
  ${dl.length?dl.slice(0,5).map(o=>`<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f6;flex-wrap:wrap"><span class="tag red">${o.elapsed}일 경과</span><span>${esc(o.order_no)}</span><span style="flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.title)}</span>${stTag(o.status)}</div>`).join(''):'<div class="empty green">지연 주문이 없어요</div>'}</div>`},
 async products(){
  const rows=await api(`/api/products?days=${st.days}&q=${encodeURIComponent(st.q)}&flag=${st.flag}`);
  const rev=rows.reduce((a,r)=>a+r.rev,0);
  return head('상품별 분석','상품코드 · 상품명으로 검색하고 판매·재고 상태를 확인해요')+periods()+
  `<div class="kpis">${kpi('검색 결과',rows.length+'개','현재 필터 기준')}${kpi('매출 합계',won(rev),'기간 내 결제금액','blue')}
  ${kpi('판매 0건 상품',rows.filter(r=>!r.n).length+'개','노출·가격 점검 대상','orange')}${kpi('재고 부족',rows.filter(r=>r.qty<10).length+'개','재고 10개 미만','red')}</div>`+
  search('상품코드 또는 상품명 입력')+pills([['top','매출 있음'],['nosale','판매 0건'],['low','재고 부족']],'flag')+
  table(rows,[{k:'item_code',h:'상품번호'},{k:'seller_code',h:'셀러코드'},{k:'title',h:'상품명',t:1},
   {k:'price',h:'판매가',r:1,f:won},{k:'discount',h:'할인율',r:1,f:v=>v?v.toFixed(0)+'%':'-'},
   {k:'qty',h:'재고',r:1,f:v=>`<span class="${v<10?'red':''}">${nf(v)}</span>`},{k:'n',h:'주문',r:1,f:nf},{k:'sold',h:'판매수량',r:1,f:nf},
   {k:'rev',h:'매출',r:1,f:v=>`<b>${won(v)}</b>`},{k:'rev',h:'매출 비중',r:1,f:v=>rev?(v/rev*100).toFixed(1)+'%':'-'},
   {k:'days_left',h:'재고 소진 예상',r:1,f:v=>v==null?'-':`<span class="${v<14?'red':''}">${Math.round(v)}일</span>`}],
   `현재 필터 기준 ${rows.length}개 · 매출 ${won(rev)} · 판매중(S2) 상품 기준`)},
 async delay(){
  const rows=await api(`/api/orders?days=0&delayed=true&q=${encodeURIComponent(st.q)}`), s=SUM;
  const b=[[DD()+1,DD()+2],[DD()+3,DD()+6],[DD()+7,9999]].map(([a,z])=>rows.filter(r=>r.elapsed>=a&&r.elapsed<=z).length);
  return head('배송지연 관리',`결제 후 ${s.delay_days}일이 지나도 발송되지 않은 주문을 모아 봐요`)+
  `<div class="kpis">${kpi('지연 주문',rows.length+'건','배송요청·배송준비 상태','red')}${kpi(`${DD()+1}~${DD()+2}일 경과`,b[0]+'건','오늘 발송 권장','orange')}
  ${kpi(`${DD()+3}~${DD()+6}일 경과`,b[1]+'건','고객 안내 필요','red')}${kpi(`${DD()+7}일 이상`,b[2]+'건','취소·페널티 위험','red')}</div>`+
  search('주문번호, 상품명, 구매자 검색')+
  table(rows,[{k:'elapsed',h:'경과일',r:1,f:v=>`<span class="tag ${v>DD()+2?'red':'orange'}">${v}일</span>`},{k:'order_no',h:'주문번호'},{k:'pay_date',h:'결제일시'},
   {k:'title',h:'상품명',t:1},{k:'option',h:'옵션',t:1},{k:'qty',h:'수량',r:1},{k:'amount',h:'금액',r:1,f:won},{k:'buyer',h:'구매자'},{k:'status',h:'상태',f:stTag}],
   `기준: 결제 후 ${s.delay_days}일 초과 & 미발송 · 서버 환경변수 DELAY_DAYS로 기준 변경`)},
 async orders(){
  const rows=await api(`/api/orders?days=${st.days}&status=${encodeURIComponent(st.status)}&q=${encodeURIComponent(st.q)}`);
  return head('주문 조회','기간·상태별 주문과 송장 정보를 확인해요')+periods()+search('주문번호, 상품명, 구매자, 송장번호 검색')+
  pills([['배송요청','배송요청'],['배송준비','배송준비'],['배송중','배송중'],['배송완료','배송완료'],['구매확정','구매확정']],'status')+

const SEP=/\s*[\/／・、,，|｜]\s*|\s+or\s+/;
function splitVariant(v){v=String(v||'').trim();let m=v.match(/^(.*?)\s*[（(\[【]([^()（）\[\]【】]+)[)）\]】]\s*$/);
  if(m){const parts=m[2].split(SEP).map(x=>x.replace(/^\d+\s*(colors?|色|type|種)$/i,'').trim()).filter(Boolean);if(parts.length>1){const base=m[1].trim();return parts.map(p=>/(^|\s)[A-Z]$/.test(base)?`${base}(${p})`:`${base} ${p}`)}}

const SUBDIR=/^(썸네일|상세|thumb(nail)?s?|detail|추가이미지)$/i;
function groupFolder(files){const arr=[...files].filter(f=>!/(^|\/)\./.test(f.webkitRelativePath)&&!/thumbs\.db$/i.test(f.name));
  const byP={};
  arr.forEach(f=>{const parts=f.webkitRelativePath.normalize('NFC').split('/');
    let k=parts.findIndex((p,ix)=>ix<parts.length-1&&SUBDIR.test(p));           // 상품폴더/썸네일/01.jpg 구조
    let key,rel;if(k>0){key=parts.slice(0,k).join('/');rel=parts.slice(k)}
    else{if(parts.length<3&&parts.length>1){key=parts[0];rel=parts.slice(1)}else{key=parts.slice(0,-1).join('/');rel=parts.slice(-1)}}
    (byP[key]=byP[key]||[]).push({f,rel})});
  return Object.entries(byP).map(([key,fs])=>{const name=key.split('/').pop();const nat=(a,b)=>a.rel.join('/').localeCompare(b.rel.join('/'),undefined,{numeric:true});fs.sort(nat);
    const html=fs.find(x=>/\.html?$/i.test(x.f.name));const imgs=fs.filter(x=>IMG.test(x.f.name));
    const inDir=(x,re)=>x.rel.length>1&&re.test(x.rel[0]);
    const thumbDir=imgs.filter(x=>inDir(x,/^(썸네일|thumb)/i));
    let thumb,gal,named=true;
    if(thumbDir.length){thumb=thumbDir.find(x=>/^0*1[_\-. ]|main|대표/i.test(x.f.name))||thumbDir[0];gal=thumbDir.filter(x=>x!==thumb)}      // 01 = 대표, 02~ = 추가이미지
    else{gal=imgs.filter(x=>inDir(x,/추가|add|gallery|sub|extra|서브/i));const nm=imgs.find(x=>/썸네일|thumb|대표|main/i.test(x.rel.join('/')));named=!!nm;thumb=nm||imgs.find(x=>x.rel.length===1&&!gal.includes(x));gal=gal.filter(x=>x!==thumb)}
    const no=(name.match(/(?<!\d)(\d{4,5})(?!\d)/)||[])[1]||'';
    return {name,no,html,thumb,thumbGuess:!named&&!!thumb,gal,all:fs,on:true,status:'대기',title:'',res:null}}).filter(x=>x.html||x.thumb).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))}

  try{const j=await api(`/api/items/${code}/detail`);let o=j.ResultObject;o=Array.isArray(o)?o[0]:(o||{});
   const f=(...res)=>{for(const re of res)for(const[k,v]of Object.entries(o))if(re.test(k)&&v!==''&&v!=null)return clean(v);return ''};
   E.orig={ItemTitle:f(/^ItemTitle$/i),PromotionName:f(/^PromotionName$/i),Keyword:f(/^(Keyword|SearchKeyword)$/i),SecondSubCat:f(/^SecondSubCat(Cd)?$/i),
    ShippingNo:f(/^ShippingNo$/i,/DeliveryGroup/i),ContactInfo:f(/^ContactInfo$/i,/Contact/i),AvailableDateValue:f(/^AvailableDateValue$/i),
    RetailPrice:f(/^RetailPrice$/i),ItemPrice:f(/^(SellPrice|ItemPrice)$/i),ItemQty:f(/^(ItemQty|Qty|StockQty)$/i),
    StandardImage:f(/^(StandardImage|ImageUrl|ItemImage|MainImage)$/i,/Image(Url)?$/i),ItemDescription:f(/^(ItemDescription|ItemDetail|Contents|DetailContents|ItemContents)$/i)};
   if(E.orig.RetailPrice==='0')E.orig.RetailPrice='';
   E.code=code;E.sc=sel.selectedOptions[0]?.value===code?(sel.selectedOptions[0].dataset.sc||''):clean(o.SellerCode||'');
   if(!E.sc)E.sc=clean(o.SellerCode||'');E.v={...E.orig};E.loaded=true;E.raw=o;R.gallery=[];R.inv={name:'',rows:[]};render()}
  catch(e){$('#loadMsg').textContent='불러오기 실패: '+e.message}};
window.upEdit=async inp=>{const fd=new FormData();fd.append('file',inp.files[0]);const r=await fetch('/api/images',{method:'POST',body:fd});const j=await r.json();
  if(!r.ok){alert(j.detail);return}readE();E.v.StandardImage=j.url;render()};
function editPayload(){readE();const ch=k=>String(E.v[k]??'')!==String(E.orig[k]??'');const p={seller_code:E.sc};
  if(EBASIC.some(ch)){p.basic={AdultYN:'N',AvailableDateType:'0'};EBASIC.forEach(k=>{if(E.v[k])p.basic[k]=E.v[k]})}
  if(ch('ItemPrice')||ch('ItemQty'))p.price_qty={price:E.v.ItemPrice,qty:E.v.ItemQty};
  if(ch('StandardImage')&&E.v.StandardImage)p.image=E.v.StandardImage;
  if(ch('ItemDescription')&&E.v.ItemDescription)p.description=E.v.ItemDescription;
  p.gallery=R.gallery;p.options=invPayload();return p}
function refreshE(){if(st.page!=='patch'||!E.loaded)return;const p=editPayload(),rows=[];
  if(p.basic)rows.push(['기본 정보',EBASIC.filter(k=>String(E.v[k]??'')!==String(E.orig[k]??'')).join(', ')]);
  if(p.price_qty)rows.push(['가격·재고',`${won(E.orig.ItemPrice)} → ${won(E.v.ItemPrice)} · 재고 ${E.orig.ItemQty||'-'} → ${E.v.ItemQty}`]);
  if(p.image)rows.push(['대표 이미지','교체']);if(p.description)rows.push(['상세 HTML','교체']);
  if(p.gallery.length)rows.push(['추가이미지',`${p.gallery.length}장으로 교체`]);if(p.options.rows.length)rows.push(['선택 옵션',`${p.options.rows.length}개로 교체`]);
  $('#esum').innerHTML=rows.length?rows.map(([a,b])=>`<tr><td>${a}</td><td>${esc(b)}</td></tr>`).join(''):'<tr><td colspan=2 class="desc">아직 바뀐 내용이 없어요</td></tr>';
  const pv=$('#epv');if(pv)pv.innerHTML=E.v.ItemDescription||''}
window.doPatch=async()=>{const p=editPayload();const n=[p.basic,p.price_qty,p.image,p.description].filter(Boolean).length+(p.gallery.length?1:0)+(p.options.rows.length?1:0);
  if(!n){alert('바뀐 내용이 없어요');return}if(!confirm(`상품 ${E.code}에 ${n}개 항목을 반영해요. 진행할까요?`))return;
  const b=$('#patchBtn');b.disabled=true;b.textContent='반영 중…';
  try{const r=await fetch(`/api/items/${E.code}/update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json();
   if(!r.ok)throw new Error(j.detail);const L={basic:'기본 정보',price_qty:'가격·재고',image:'대표 이미지',description:'상세 HTML',gallery:'추가이미지',options:'선택 옵션',gallery_options:'이미지·옵션'};
   const allOk=j.ok;$('#patchResult').innerHTML=`<div class="result ${allOk?'ok':'ng'}">${Object.entries(j.steps).map(([k,x])=>`<div>${String(x.ResultCode)==='0'?'✅':'❌'} ${L[k]||k}: ${esc(x.ResultMsg||x.ErrorMsg||'')}</div>`).join('')}
    <details><summary>원본 응답</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(j.steps,null,1))}</pre></details></div>`;
   if(allOk){Object.assign(E.orig,E.v)}}
  catch(e){$('#patchResult').innerHTML=`<div class="result ng">${esc(e.message)}</div>`}b.disabled=false;b.textContent='바뀐 내용 큐텐에 반영하기'};
function stepResult(j){const line=(t,x)=>x==null?'':`<div>${x.ResultCode==0||x.ResultCode==='0'?'✅':'❌'} ${t}: ${esc(x.ResultMsg||x.ErrorMsg||'')}</div>`;
  const allOk=[j.gallery,j.options].every(x=>x==null||String(x.ResultCode)==='0');
  return `<div class="result ${allOk?'ok':'ng'}">${line('추가이미지',j.gallery)}${line('선택 옵션',j.options)}<details><summary>원본 응답</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify({gallery:j.gallery,options:j.options},null,1))}</pre></details></div>`}
window.upImg=async(inp,kind)=>{for(const f of inp.files){const fd=new FormData();fd.append('file',f);
  const r=await fetch('/api/images',{method:'POST',body:fd});const j=await r.json();if(!r.ok){alert(j.detail);continue}
  if(kind==='main'){$('#r_StandardImage').value=j.url}else R.gallery.push(j.url)}inp.value='';refreshAll()};
window.aiDraft=async()=>{readR();if(!R.v.name_ko){alert('한국어 상품명을 입력해 주세요');return}
  const b=$('#aiBtn');b.disabled=true;$('#aiMsg').textContent='일본어 초안을 쓰는 중이에요… (20~40초)';
  try{const r=await fetch('/api/ai/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name_ko:R.v.name_ko,features:R.v.features,spec:R.v.spec,usage:R.v.usage,keywords:R.v.keywords})});
   const j=await r.json();if(!r.ok)throw new Error(j.detail);
   ['ItemTitle','PromotionName','ItemDescription','Keyword'].forEach(k=>{if(j[k]!=null){$('#r_'+k).value=j[k]}});$('#aiMsg').textContent='초안이 들어갔어요. 3·5단계에서 확인하고 고쳐 주세요.'}
  catch(e){$('#aiMsg').textContent='실패: '+e.message}b.disabled=false;refreshR()};
async function cloneFrom(code){if(!code)return;$('#cloneRaw').textContent='불러오는 중…';
  try{const j=await api(`/api/items/${code}/detail`),o=Array.isArray(j.ResultObject)?j.ResultObject[0]:(j.ResultObject||{});
   const find=re=>{for(const[k,v]of Object.entries(o))if(re.test(k)&&v!==''&&v!=null)return v;return ''};
   const map={SecondSubCat:find(/^(SecondSubCatCd|SecondSubCat|CategoryNo|CategoryCode)$/i)||find(/^Second.*Cat/i),ShippingNo:find(/ShippingNo|DeliveryGroup/i),
     ContactInfo:find(/ContactInfo|ContactTel|ContactEmail/i),ProductionPlaceType:find(/ProductionPlaceType/i),ProductionPlace:find(/^ProductionPlace$/i),AvailableDateValue:find(/AvailableDateValue/i)};
   for(const[k,v]of Object.entries(map))if(v){const e=$('#r_'+k);if(e){if(e.tagName==='SELECT'&&![...e.options].some(x=>x.value==v))e.add(new Option(v,v));e.value=v}}
   $('#cloneRaw').innerHTML=`가져온 값: ${Object.entries(map).filter(([,v])=>v).map(([k,v])=>`${k}=${esc(v)}`).join(' · ')||'없음'} <details><summary>원본 응답 보기</summary><pre style="white-space:pre-wrap;max-height:240px;overflow:auto">${esc(JSON.stringify(o,null,1))}</pre></details>`}
  catch(e){$('#cloneRaw').textContent='불러오기 실패: '+e.message}refreshR()}
window.doRegister=async()=>{const p=buildParams(),b=$('#regBtn');if(!$('#confirm').checked){alert('최종 확인에 체크해 주세요');return}
  b.disabled=true;b.textContent='등록 중…';
  try{let j,rok=true;try{j=await regPost({params:p,confirm:true,gallery:R.gallery,options:invPayload()})}catch(e){rok=false;j={detail:e.message}}const r={ok:rok};
   $('#regResult').innerHTML=!r.ok?`<div class="result ng">등록 전 확인 필요: ${esc(j.detail)}</div>`:j.ok?`<div class="result ok"><b>등록 성공</b> — 상품번호 ${esc(j.gd_no)}. QSM에서 노출 상태를 확인해 주세요.</div>${(j.gallery||j.options)?stepResult(j):''}`:`<div class="result ng"><b>큐텐이 거절했어요</b>: ${esc(j.message)}<details><summary>원본 응답</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(j.raw,null,1))}</pre></details></div>`}
  catch(e){$('#regResult').innerHTML=`<div class="result ng">${esc(e.message)}</div>`}b.disabled=false;b.textContent='큐텐에 등록하기'};
function bindRegister(){if(st.page==='audit'){auditPoll();return}
  if(st.page==='quick'){renderQ();$('#q_dir').onchange=e=>{Q.items=qPrepFolder(e.target.files);Q.open=-1;renderQ();$('#q_msg').textContent=`${Q.items.length}개 상품 폴더를 찾았어요`};return}
  if(st.page==='sheet'){renderX();
    $('#x_file').onchange=async e=>{const fd=new FormData();fd.append('file',e.target.files[0]);$('#x_msg').textContent='읽는 중…';
      try{const r=await fetch('/api/sheet/parse',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.detail);X.items=j.items.map(i=>({...i,on:true}));$('#x_msg').textContent=`단품 ${X.items.filter(i=>i.kind==='단품').length}개 · 모음전 ${X.items.filter(i=>i.kind==='모음전').length}개를 읽었어요`;await xPrice()}
      catch(err){$('#x_msg').textContent='읽기 실패: '+err.message}};
    $('#x_dir').onchange=async e=>{const files=[...e.target.files];let n=0;for(const it of X.items){if(it.desc||!it.desc_path)continue;const want=it.desc_path.replace(/^\/+/,'');
      const segs=want.normalize('NFC').split('/'),head=segs[0],tail='/'+segs.slice(1).join('/');const f=files.find(f=>{const p=f.webkitRelativePath.normalize('NFC');const ps=p.split('/');return p.endsWith(tail)&&ps.some(x=>x===head||x.startsWith(head+'_')||x.startsWith(head+' '))});if(f){it.desc=await f.text();n++}}
      $('#x_dirmsg').textContent=`상세 HTML ${n}개를 연결했어요`;xPrice()};
    ['x_src','x_krw','x_jpy','x_cbase','x_oqty'].forEach(id=>$('#'+id).addEventListener('change',()=>xPrice()));return}
  if(st.page==='batch'){renderB();$('#b_dir').onchange=e=>{B.items=groupFolder(e.target.files);renderB();$('#b_msg').textContent=`${B.items.length}개 상품 폴더를 찾았어요`};$('#b_tpl').onchange=()=>{B.tpl=$('#b_tpl').value;loadTpl()};if(!B.tplv)loadTpl();return}
  if(st.page==='patch'){const s=$('#p_code');s.onchange=()=>{$('#p_code2').value=s.value};if(!E.loaded)return;renderOpts();renderGal();refreshE();
    document.querySelectorAll('[id^=e_],#o_name').forEach(e=>e.addEventListener('input',refreshE));
    $('#e_ItemDescription').addEventListener('paste',()=>setTimeout(()=>{if(!R.inv.rows.filter(r=>r&&r.value).length)aiOptions(true)},300));return}
  if(st.page!=='register')return;renderOpts();renderGal();refreshR();
  $('#r_ItemDescription').addEventListener('paste',()=>setTimeout(()=>{if(R.cfg.ai&&!R.inv.rows.filter(r=>r&&r.value).length)aiOptions(true)},300));$('#toDesc').onchange=refreshAll;$('#o_name').oninput=refreshAll;
  document.querySelectorAll('[id^=r_]').forEach(e=>{e.addEventListener('input',refreshR);e.addEventListener('change',refreshR)});
  $('#r_clone').onchange=e=>{R.v.clone=e.target.value;cloneFrom(e.target.value)}}
window.go=p=>{st.page=p;location.hash=p;render()};
window.doSync=async b=>{if(st.page==='register')readR();b.disabled=true;b.textContent='동기화 중…';try{const r=await api('/api/sync');alert(r.ok?`완료: 상품 ${r.products}개 · 주문 ${r.orders}건`:`실패: ${r.message}`)}catch(e){alert(e)}render()};

async function render(keepFocus){
  const pos=$('#q')?.selectionStart;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===st.page));
  try{SUM=await api(`/api/summary?days=${st.days}`);
    $('#main').innerHTML=await pages[st.page]();
    const c=$('#delayCt');c.hidden=!SUM.delayed;c.textContent=SUM.delayed;
    if(SUM.last_sync)$('#lastSync').textContent='마지막 동기화 '+SUM.last_sync.finished.replace('T',' ').slice(5,16);
  }catch(e){$('#main').innerHTML=`<div class="empty">불러오지 못했어요 (${e.message})</div>`}
  bindSearch();bindRegister();if(keepFocus&&$('#q')){$('#q').focus();$('#q').setSelectionRange(pos,pos)}
}
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(pages[p]&&p!==st.page){swapState(st.page,p);st.page=p;st.q='';st.flag='';st.status='';render()}});
if(!pages[st.page])st.page='home';
render();
</script>
